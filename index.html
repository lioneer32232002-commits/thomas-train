<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dino Rail Craft ▶</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 60'><rect x='30' y='6' width='22' height='18' fill='%235FA83C'/><rect x='30' y='6' width='22' height='4' fill='%237DC850'/><rect x='44' y='12' width='5' height='5' fill='white'/><rect x='46' y='14' width='3' height='3' fill='black'/><rect x='12' y='30' width='56' height='20' fill='%236B6B6B'/><rect x='12' y='30' width='56' height='4' fill='%239A9A9A'/><rect x='16' y='34' width='48' height='12' fill='%23444'/><circle cx='24' cy='52' r='6' fill='%231a1a1a'/><circle cx='56' cy='52' r='6' fill='%231a1a1a'/><circle cx='24' cy='52' r='2.5' fill='%23888'/><circle cx='56' cy='52' r='2.5' fill='%23888'/></svg>">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=4">
<meta name="description" content="Build the rails and let the dino minecart roll — in blocky Minecraft style!">
<meta property="og:type"        content="website">
<meta property="og:title"       content="Dino Rail Craft ▶">
<meta property="og:description" content="Build the rails and let the dino minecart roll — in blocky Minecraft style!">
<meta property="og:image"       content="https://thomas-train.pages.dev/og-banner.png?v=4">
<meta property="og:url"         content="https://thomas-train.pages.dev">
<meta name="twitter:card"       content="summary_large_image">
<meta name="twitter:title"      content="Dino Rail Craft ▶">
<meta name="twitter:description" content="Build the rails and let the dino minecart roll — in blocky Minecraft style!">
<meta name="twitter:image"      content="https://thomas-train.pages.dev/og-banner.png?v=4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- ── PROFILE SELECT ──────────────────────────────────────────────── -->
  <div id="profile-select">
    <h1 id="ps-title">🦖 Dino Rail Craft</h1>
    <p id="ps-subtitle">Who's playing?</p>
    <div id="ps-cards"></div>
    <button id="ps-add-btn">➕ Add Player</button>
  </div>

  <!-- ── NAME INPUT DIALOG ─────────────────────────────────────────── -->
  <div id="name-dialog" style="display:none">
    <div id="name-dialog-box">
      <div id="name-dialog-emoji"></div>
      <div id="name-dialog-title">Pick a dino &amp; enter your name!</div>
      <div id="name-dino-picker"><!-- blocky dino options built in app.js --></div>
      <input id="name-input" type="text" maxlength="10" placeholder="Your name…" autocomplete="off">
      <div id="name-dialog-actions">
        <button id="name-cancel-btn">Cancel</button>
        <button id="name-confirm-btn">Let's Go! 🚀</button>
      </div>
    </div>
  </div>

  <!-- ── LEVEL SELECT ──────────────────────────────────────────────────── -->
  <div id="level-select" style="display:none">
    <div id="ls-thomas">
      <!-- Full train: engine + 3 carriages -->
      <svg id="ls-train" viewBox="0 0 336 90" xmlns="http://www.w3.org/2000/svg">
        <!-- Clouds -->
        <rect x="26" y="6" width="40" height="11" fill="#FFFFFF" opacity="0.9"/>
        <rect x="40" y="0" width="18" height="7" fill="#FFFFFF" opacity="0.7"/>
        <rect x="276" y="12" width="38" height="10" fill="#FFFFFF" opacity="0.85"/>
        <!-- Grass ground -->
        <rect x="0" y="80" width="336" height="10" fill="#6CAB3C"/>
        <rect x="0" y="80" width="336" height="3" fill="#86C84C"/>
        <!-- Ties + rail -->
        <rect x='6' y='66' width='8' height='16' fill='#5C3E2A'/><rect x='30' y='66' width='8' height='16' fill='#5C3E2A'/><rect x='54' y='66' width='8' height='16' fill='#5C3E2A'/><rect x='78' y='66' width='8' height='16' fill='#5C3E2A'/><rect x='102' y='66' width='8' height='16' fill='#5C3E2A'/><rect x='126' y='66' width='8' height='16' fill='#5C3E2A'/><rect x='150' y='66' width='8' height='16' fill='#5C3E2A'/><rect x='174' y='66' width='8' height='16' fill='#5C3E2A'/><rect x='198' y='66' width='8' height='16' fill='#5C3E2A'/><rect x='222' y='66' width='8' height='16' fill='#5C3E2A'/><rect x='246' y='66' width='8' height='16' fill='#5C3E2A'/><rect x='270' y='66' width='8' height='16' fill='#5C3E2A'/><rect x='294' y='66' width='8' height='16' fill='#5C3E2A'/><rect x='318' y='66' width='8' height='16' fill='#5C3E2A'/>
        <rect x="0" y="62" width="336" height="4" fill="#BCBCBC"/>
        <rect x="0" y="66" width="336" height="2" fill="#7A7A7A"/>
        <!-- Wheels -->
        <circle cx="150" cy="70" r="11" fill="#1A1A1A"/><circle cx="150" cy="70" r="4" fill="#888"/>
        <circle cx="214" cy="70" r="11" fill="#1A1A1A"/><circle cx="214" cy="70" r="4" fill="#888"/>
        <rect x="150" y="69" width="64" height="3" fill="#3a3a3a"/>
        <!-- Dino tail poking out the back -->
        <rect x="104" y="40" width="22" height="13" fill="#4E8A2A"/>
        <rect x="118" y="34" width="16" height="13" fill="#5FA83C"/>
        <!-- Minecart iron tub -->
        <rect x="122" y="34" width="112" height="30" fill="#6B6B6B"/>
        <rect x="122" y="34" width="112" height="4" fill="#9A9A9A"/>
        <rect x="122" y="60" width="112" height="4" fill="#4F4F4F"/>
        <rect x="122" y="34" width="4" height="30" fill="#9A9A9A"/>
        <rect x="230" y="34" width="4" height="30" fill="#4F4F4F"/>
        <rect x="130" y="40" width="96" height="20" fill="#3F3F3F"/>
        <!-- Dino sitting inside -->
        <rect x="176" y="30" width="20" height="16" fill="#5FA83C"/>
        <rect x="198" y="40" width="9" height="11" fill="#4E8A2A"/>
        <rect x="166" y="6" width="46" height="30" fill="#5FA83C" stroke="#3B6B22" stroke-width="2"/>
        <rect x="168" y="8" width="42" height="5" fill="#7DC850"/>
        <rect x="206" y="18" width="24" height="16" fill="#5FA83C" stroke="#3B6B22" stroke-width="2"/>
        <rect x="206" y="18" width="24" height="4" fill="#7DC850"/>
        <rect x="189" y="13" width="10" height="10" fill="#FFFFFF"/>
        <rect x="192" y="16" width="6" height="6" fill="#1A1A1A"/>
        <rect x="222" y="23" width="4" height="4" fill="#3B6B22"/>
        <rect x="208" y="33" width="4" height="5" fill="#FFFFFF"/>
        <rect x="216" y="33" width="4" height="5" fill="#FFFFFF"/>
        <rect x="224" y="33" width="4" height="4" fill="#FFFFFF"/>
      </svg>
    </div>
    <h1 id="ls-title">🦖 Dino Rail Craft</h1>
    <div id="ls-player-bar">
      <span id="ls-player-name">👤</span>
      <button id="ls-switch-btn">Switch Player</button>
    </div>
    <div id="ls-score-bar">
      <span id="ls-score">⭐ 0 / 750 pts</span>
      <button id="btn-reset" class="ls-reset-btn">🔄 Reset</button>
    </div>
    <div id="ls-groups">
      <div class="ls-group" data-group="1">
        <div class="ls-group-label">⭐ Place 1 Track</div>
        <div class="ls-levels" id="ls-g1"></div>
      </div>
      <div class="ls-group" data-group="2">
        <div class="ls-group-label">⭐⭐ Place 2 Tracks</div>
        <div class="ls-levels" id="ls-g2"></div>
      </div>
      <div class="ls-group" data-group="3">
        <div class="ls-group-label">⭐⭐⭐ Place 3 Tracks</div>
        <div class="ls-levels" id="ls-g3"></div>
      </div>
      <div class="ls-group" data-group="4">
        <div class="ls-group-label">⭐⭐⭐⭐ Place 4 Tracks</div>
        <div class="ls-levels" id="ls-g4"></div>
      </div>
      <div class="ls-group" data-group="5">
        <div class="ls-group-label">⭐⭐⭐⭐⭐ Place 5 Tracks</div>
        <div class="ls-levels" id="ls-g5"></div>
      </div>
    </div>
    <div id="ls-collection-bar">
      <button id="btn-dino-dex" class="action-btn">🦕 Dino Dex</button>
      <button id="btn-stickers" class="action-btn">🏆 Stickers</button>
    </div>
    <button id="btn-free-mode" class="action-btn orange">🎨 Creative</button>
  </div>

  <!-- ── DINO DEX OVERLAY ──────────────────────────────────────────────── -->
  <div id="dex-overlay" class="collect-overlay" style="display:none">
    <div class="collect-box">
      <div class="collect-title">🦕 Dino Dex</div>
      <div class="collect-sub" id="dex-progress"></div>
      <div id="dex-cards" class="collect-grid"></div>
      <button class="collect-close" id="dex-close">Close</button>
    </div>
  </div>

  <!-- ── STICKER WALL OVERLAY ──────────────────────────────────────────── -->
  <div id="sticker-overlay" class="collect-overlay" style="display:none">
    <div class="collect-box">
      <div class="collect-title">🏆 Sticker Wall</div>
      <div class="collect-sub" id="sticker-progress"></div>
      <div id="sticker-grid" class="collect-grid sticker-grid"></div>
      <button class="collect-close" id="sticker-close">Close</button>
    </div>
  </div>

  <!-- ── GAME SCREEN ───────────────────────────────────────────────────── -->
  <div id="game-screen" style="display:none">
    <header id="header">
      <button id="btn-back" class="action-btn">← Back</button>
      <div id="level-info">
        <div id="thomas-logo">
          <svg id="thomas-face" viewBox="0 0 80 60" width="60" height="45">
            <rect x="30" y="6" width="24" height="20" fill="#5FA83C"/>
            <rect x="30" y="6" width="24" height="4" fill="#7DC850"/>
            <rect x="50" y="14" width="10" height="9" fill="#5FA83C"/>
            <rect x="42" y="12" width="7" height="7" fill="white"/>
            <rect x="44" y="14" width="4" height="4" fill="black"/>
            <rect x="52" y="22" width="3" height="4" fill="white"/>
            <rect x="10" y="30" width="60" height="20" fill="#6B6B6B"/>
            <rect x="10" y="30" width="60" height="4" fill="#9A9A9A"/>
            <rect x="14" y="34" width="52" height="12" fill="#3F3F3F"/>
            <circle cx="24" cy="52" r="6" fill="#1A1A1A"/><circle cx="24" cy="52" r="2.4" fill="#888"/>
            <circle cx="56" cy="52" r="6" fill="#1A1A1A"/><circle cx="56" cy="52" r="2.4" fill="#888"/>
          </svg>
        </div>
        <div id="level-title-display"></div>
        <div id="gaps-counter"></div>
        <button id="btn-hint" class="hint-btn" title="Hint" style="display:none">
          💡 <span class="hint-count">0</span>
        </button>
      </div>
      <div class="header-spacer"></div>
    </header>

    <!-- Toolbar -->
    <div id="toolbar">
      <div id="track-tools">
        <button class="tool-btn active" data-track="straight-h" data-unlock-level="1" title="Straight (H)">
          <svg viewBox="0 0 50 50" width="44" height="44"><rect x="0" y="20" width="50" height="10" fill="#8B4513"/><line x1="0" y1="17" x2="50" y2="17" stroke="#555" stroke-width="3"/><line x1="0" y1="33" x2="50" y2="33" stroke="#555" stroke-width="3"/><rect x="8" y="17" width="5" height="16" fill="#8B4513"/><rect x="20" y="17" width="5" height="16" fill="#8B4513"/><rect x="32" y="17" width="5" height="16" fill="#8B4513"/></svg>
          <span>━</span>
        </button>
        <button class="tool-btn" data-track="straight-v" data-unlock-level="1" title="Straight (V)">
          <svg viewBox="0 0 50 50" width="44" height="44"><rect x="20" y="0" width="10" height="50" fill="#8B4513"/><line x1="17" y1="0" x2="17" y2="50" stroke="#555" stroke-width="3"/><line x1="33" y1="0" x2="33" y2="50" stroke="#555" stroke-width="3"/><rect x="17" y="8" width="16" height="5" fill="#8B4513"/><rect x="17" y="20" width="16" height="5" fill="#8B4513"/><rect x="17" y="32" width="16" height="5" fill="#8B4513"/></svg>
          <span>┃</span>
        </button>
        <button class="tool-btn" data-track="curve-ne" data-unlock-level="1" title="Curve ↗">
          <svg viewBox="0 0 50 50" width="44" height="44">
            <path d="M 25 0 A 25 25 0 0 0 50 25" stroke="#8B6914" stroke-width="9" fill="none" stroke-linecap="round"/>
            <path d="M 31 0 A 19 19 0 0 0 50 19" stroke="#757575" stroke-width="2.5" fill="none"/>
            <path d="M 19 0 A 31 31 0 0 0 50 31" stroke="#757575" stroke-width="2.5" fill="none"/>
          </svg>
          <span>↗</span>
        </button>
        <button class="tool-btn" data-track="curve-nw" data-unlock-level="1" title="Curve ↖">
          <svg viewBox="0 0 50 50" width="44" height="44">
            <path d="M 25 0 A 25 25 0 0 1 0 25" stroke="#8B6914" stroke-width="9" fill="none" stroke-linecap="round"/>
            <path d="M 19 0 A 19 19 0 0 1 0 19" stroke="#757575" stroke-width="2.5" fill="none"/>
            <path d="M 31 0 A 31 31 0 0 1 0 31" stroke="#757575" stroke-width="2.5" fill="none"/>
          </svg>
          <span>↖</span>
        </button>
        <button class="tool-btn" data-track="curve-se" data-unlock-level="1" title="Curve ↘">
          <svg viewBox="0 0 50 50" width="44" height="44">
            <path d="M 25 50 A 25 25 0 0 1 50 25" stroke="#8B6914" stroke-width="9" fill="none" stroke-linecap="round"/>
            <path d="M 31 50 A 19 19 0 0 1 50 31" stroke="#757575" stroke-width="2.5" fill="none"/>
            <path d="M 19 50 A 31 31 0 0 1 50 19" stroke="#757575" stroke-width="2.5" fill="none"/>
          </svg>
          <span>↘</span>
        </button>
        <button class="tool-btn" data-track="curve-sw" data-unlock-level="1" title="Curve ↙">
          <svg viewBox="0 0 50 50" width="44" height="44">
            <path d="M 25 50 A 25 25 0 0 0 0 25" stroke="#8B6914" stroke-width="9" fill="none" stroke-linecap="round"/>
            <path d="M 19 50 A 19 19 0 0 0 0 31" stroke="#757575" stroke-width="2.5" fill="none"/>
            <path d="M 31 50 A 31 31 0 0 0 0 19" stroke="#757575" stroke-width="2.5" fill="none"/>
          </svg>
          <span>↙</span>
        </button>
        <button class="tool-btn special" data-track="tunnel" data-unlock-level="5" title="Tunnel" style="display:none">
          <svg viewBox="0 0 50 50" width="44" height="44"><rect x="0" y="30" width="50" height="20" fill="#6d4c41"/><path d="M 5 30 Q 25 5 45 30 Z" fill="#546e7a"/><rect x="5" y="38" width="17" height="12" fill="#222"/><rect x="28" y="38" width="17" height="12" fill="#222"/><rect x="0" y="42" width="50" height="8" fill="#8B4513"/></svg>
          <span>Tunnel</span>
        </button>
        <button class="tool-btn special" data-track="bridge" data-unlock-level="5" title="Bridge" style="display:none">
          <svg viewBox="0 0 50 50" width="44" height="44"><rect x="0" y="20" width="50" height="8" fill="#8B4513"/><line x1="0" y1="18" x2="50" y2="18" stroke="#555" stroke-width="2"/><line x1="0" y1="30" x2="50" y2="30" stroke="#555" stroke-width="2"/><rect x="5" y="28" width="8" height="20" fill="#9e9e9e"/><rect x="37" y="28" width="8" height="20" fill="#9e9e9e"/><path d="M 9 28 Q 25 10 41 28" stroke="#9e9e9e" stroke-width="3" fill="none"/></svg>
          <span>Bridge</span>
        </button>
        <button class="tool-btn special" data-track="station" data-unlock-level="13" title="Station" style="display:none">
          <svg viewBox="0 0 50 50" width="44" height="44">
            <rect x="0" y="28" width="50" height="22" fill="#BCAAA4"/>
            <rect x="4" y="28" width="42" height="4" fill="#6D4C41"/>
            <polygon points="0,28 25,8 50,28" fill="#E53935"/>
            <rect x="18" y="14" width="14" height="14" fill="#FFF9C4"/>
            <rect x="22" y="18" width="6" height="10" fill="#5D4037"/>
            <rect x="0" y="36" width="50" height="6" fill="#8D6E63"/>
          </svg>
          <span>Station</span>
        </button>
        <button class="tool-btn special" data-track="cross" data-unlock-level="20" title="Crossing Rails (figure-8)" style="display:none">
          <svg viewBox="0 0 50 50" width="44" height="44">
            <rect x="0" y="20" width="50" height="10" fill="#8B4513"/>
            <rect x="20" y="0" width="10" height="50" fill="#8B4513"/>
            <line x1="0" y1="17" x2="50" y2="17" stroke="#757575" stroke-width="2.5"/>
            <line x1="0" y1="33" x2="50" y2="33" stroke="#757575" stroke-width="2.5"/>
            <line x1="17" y1="0" x2="17" y2="50" stroke="#757575" stroke-width="2.5"/>
            <line x1="33" y1="0" x2="33" y2="50" stroke="#757575" stroke-width="2.5"/>
          </svg>
          <span>✚</span>
        </button>
        <button class="tool-btn special" data-track="crossing" data-unlock-level="14" title="Crossing" style="display:none">
          <svg viewBox="0 0 50 50" width="44" height="44">
            <rect x="0" y="18" width="50" height="14" fill="#BCAAA4"/>
            <rect x="18" y="0" width="14" height="50" fill="#78909C"/>
            <rect x="18" y="0" width="14" height="4" fill="#F44336"/>
            <rect x="18" y="46" width="14" height="4" fill="#F44336"/>
            <line x1="24" y1="0" x2="24" y2="18" stroke="#FFD700" stroke-width="2.5" stroke-dasharray="4,4"/>
            <line x1="24" y1="32" x2="24" y2="50" stroke="#FFD700" stroke-width="2.5" stroke-dasharray="4,4"/>
            <line x1="0" y1="16" x2="50" y2="16" stroke="#555" stroke-width="2.5"/>
            <line x1="0" y1="34" x2="50" y2="34" stroke="#555" stroke-width="2.5"/>
          </svg>
          <span>Crossing</span>
        </button>
      </div>
      <div id="action-btns">
        <button id="btn-test" class="action-btn green">
          <span>▶ Go!</span>
        </button>
        <button id="btn-stop" class="action-btn red" style="display:none">
          <span>🛑 Stop</span>
        </button>
        <button id="btn-clear" class="action-btn orange">
          <span>🗑️ Clear</span>
        </button>
      </div>
    </div>

    <!-- Main area -->
    <div id="main-area">
      <canvas id="grid-canvas"></canvas>
      <canvas id="train-canvas"></canvas>
      <div id="gap-overlay"></div>
    </div>
  </div>

  <!-- ── GRAND FINALE CELEBRATION ────────────────────────────────────── -->
  <div id="celebration-overlay" style="display:none">
    <canvas id="celebration-canvas"></canvas>
    <div id="celebration-card">
      <span id="celebration-trophy">🏆</span>
      <div id="celebration-title">You're a Train Master!</div>
      <div id="celebration-sub">All 25 Levels Complete! ▶</div>
      <div id="celebration-score"></div>
      <span id="celebration-stars">⭐⭐⭐⭐⭐</span>
      <button id="celebration-back">🏠 Back to Menu</button>
    </div>
  </div>

  <!-- ── MESSAGE OVERLAY ───────────────────────────────────────────────── -->
  <div id="message-overlay" style="display:none">
    <div id="message-box">
      <div id="message-icon"></div>
      <div id="message-text"></div>
      <div id="message-actions">
        <button id="message-close">OK!</button>
        <button id="message-next" style="display:none">Next Level →</button>
      </div>
    </div>
  </div>

</div>

<script src="tracks.js"></script>
<script src="train.js"></script>
<script src="sound.js"></script>
<script src="levels.js"></script>
<script src="app.js"></script>
</body>
</html>
