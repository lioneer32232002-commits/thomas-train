<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>湯瑪士火車樂園 🚂</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 60'><rect x='5' y='5' width='70' height='50' rx='8' fill='%231565C0'/><rect x='10' y='10' width='60' height='35' rx='5' fill='%231976D2'/><ellipse cx='25' cy='25' rx='10' ry='11' fill='white'/><ellipse cx='55' cy='25' rx='10' ry='11' fill='white'/><ellipse cx='27' cy='25' rx='6' ry='7' fill='%231565C0'/><ellipse cx='57' cy='25' rx='6' ry='7' fill='%231565C0'/><circle cx='29' cy='23' r='2' fill='white'/><circle cx='59' cy='23' r='2' fill='white'/><path d='M 22 38 Q 40 48 58 38' stroke='%23FF8F00' stroke-width='3' fill='none' stroke-linecap='round'/><ellipse cx='40' cy='32' rx='3' ry='2' fill='%23FF8F00'/></svg>">
<link rel="apple-touch-icon" href="og-banner.png">
<meta name="description" content="幫湯瑪士鋪好鐵軌，讓他出發！">
<meta property="og:type"        content="website">
<meta property="og:title"       content="湯瑪士火車樂園 🚂">
<meta property="og:description" content="幫湯瑪士鋪好鐵軌，讓他出發！">
<meta property="og:image"       content="https://thomas-train.pages.dev/og-banner.png?v=2">
<meta property="og:url"         content="https://thomas-train.pages.dev">
<meta name="twitter:card"       content="summary_large_image">
<meta name="twitter:title"      content="湯瑪士火車樂園 🚂">
<meta name="twitter:description" content="幫湯瑪士鋪好鐵軌，讓他出發！">
<meta name="twitter:image"      content="https://thomas-train.pages.dev/og-banner.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- ── LEVEL SELECT ──────────────────────────────────────────────────── -->
  <div id="level-select">
    <div id="ls-thomas">
      <!-- Full train: engine + 3 carriages -->
      <svg id="ls-train" viewBox="0 0 336 90" xmlns="http://www.w3.org/2000/svg">
        <!-- Track -->
        <rect x="0" y="66" width="336" height="16" fill="#BCAAA4"/>
        <rect x="4"   y="64" width="10" height="18" fill="#6D4C41"/>
        <rect x="22"  y="64" width="10" height="18" fill="#6D4C41"/>
        <rect x="40"  y="64" width="10" height="18" fill="#6D4C41"/>
        <rect x="58"  y="64" width="10" height="18" fill="#6D4C41"/>
        <rect x="76"  y="64" width="10" height="18" fill="#6D4C41"/>
        <rect x="94"  y="64" width="10" height="18" fill="#6D4C41"/>
        <rect x="112" y="64" width="10" height="18" fill="#6D4C41"/>
        <rect x="130" y="64" width="10" height="18" fill="#6D4C41"/>
        <rect x="148" y="64" width="10" height="18" fill="#6D4C41"/>
        <rect x="166" y="64" width="10" height="18" fill="#6D4C41"/>
        <rect x="184" y="64" width="10" height="18" fill="#6D4C41"/>
        <rect x="202" y="64" width="10" height="18" fill="#6D4C41"/>
        <rect x="220" y="64" width="10" height="18" fill="#6D4C41"/>
        <rect x="238" y="64" width="10" height="18" fill="#6D4C41"/>
        <rect x="256" y="64" width="10" height="18" fill="#6D4C41"/>
        <rect x="274" y="64" width="10" height="18" fill="#6D4C41"/>
        <rect x="292" y="64" width="10" height="18" fill="#6D4C41"/>
        <rect x="310" y="64" width="10" height="18" fill="#6D4C41"/>
        <rect x="328" y="64" width="10" height="18" fill="#6D4C41"/>
        <line x1="0" y1="67" x2="336" y2="67" stroke="#757575" stroke-width="2.5"/>
        <line x1="0" y1="76" x2="336" y2="76" stroke="#757575" stroke-width="2.5"/>

        <!-- Steam puffs -->
        <circle cx="25" cy="10" r="6"   fill="rgba(255,255,255,0.75)"/>
        <circle cx="18" cy="4"  r="4.5" fill="rgba(255,255,255,0.55)"/>
        <circle cx="12" cy="0"  r="3"   fill="rgba(255,255,255,0.35)"/>

        <!-- ENGINE -->
        <!-- Chimney -->
        <rect x="24" y="18" width="11" height="19" rx="2" fill="#1A237E"/>
        <rect x="20" y="14" width="19" height="7"  rx="3" fill="#283593"/>
        <!-- Boiler body -->
        <rect x="8"  y="30" width="80" height="37" rx="7" fill="#1565C0"/>
        <!-- Boiler shine -->
        <rect x="13" y="31" width="68" height="11" rx="5" fill="#1976D2" opacity="0.6"/>
        <!-- Boiler dome -->
        <ellipse cx="63" cy="30" rx="10" ry="6" fill="#1976D2"/>
        <!-- Thomas FACE panel -->
        <ellipse cx="29" cy="47" rx="17" ry="15" fill="#1976D2"/>
        <ellipse cx="22" cy="43" rx="5"  ry="5.5" fill="white"/>
        <ellipse cx="36" cy="43" rx="5"  ry="5.5" fill="white"/>
        <ellipse cx="23" cy="43" rx="3"  ry="3.5" fill="#1565C0"/>
        <ellipse cx="37" cy="43" rx="3"  ry="3.5" fill="#1565C0"/>
        <circle  cx="24" cy="41" r="1.5" fill="white"/>
        <circle  cx="38" cy="41" r="1.5" fill="white"/>
        <ellipse cx="29" cy="50" rx="2"  ry="1.5" fill="#FF8F00"/>
        <path d="M 21 53 Q 29 59 37 53" stroke="#FF8F00" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <!-- Buffer end -->
        <rect x="3" y="36" width="8" height="24" rx="3" fill="#0D47A1"/>
        <rect x="0" y="49" width="8" height="8"  rx="2" fill="#E53935"/>
        <!-- Cab -->
        <rect x="81" y="26" width="28" height="40" rx="4" fill="#1976D2"/>
        <rect x="78" y="20" width="34" height="10" rx="4" fill="#1A237E"/>
        <rect x="83" y="30" width="12" height="10" rx="2" fill="#90CAF9"/>
        <rect x="97" y="30" width="10" height="10" rx="2" fill="#90CAF9"/>
        <!-- Engine wheels -->
        <circle cx="25" cy="78" r="9"  fill="#1A1A1A"/><circle cx="25" cy="78" r="6"  fill="#37474F"/><circle cx="25" cy="78" r="2"  fill="#CFD8DC"/>
        <circle cx="60" cy="77" r="11" fill="#1A1A1A"/><circle cx="60" cy="77" r="8"  fill="#37474F"/><circle cx="60" cy="77" r="3"  fill="#CFD8DC"/>
        <circle cx="88" cy="78" r="9"  fill="#1A1A1A"/><circle cx="88" cy="78" r="6"  fill="#37474F"/><circle cx="88" cy="78" r="2"  fill="#CFD8DC"/>
        <!-- Coupler e→1 -->
        <rect x="107" y="57" width="10" height="4.5" rx="2" fill="#546E7A"/>

        <!-- CARRIAGE 1 (red) -->
        <rect x="115" y="28" width="69" height="10" rx="4" fill="#B71C1C"/>
        <rect x="115" y="34" width="63" height="33" rx="5" fill="#E53935"/>
        <rect x="120" y="38" width="14" height="13" rx="2" fill="#BBDEFB"/>
        <rect x="140" y="38" width="14" height="13" rx="2" fill="#BBDEFB"/>
        <rect x="158" y="38" width="11" height="13" rx="2" fill="#BBDEFB"/>
        <circle cx="127" cy="78" r="8.5" fill="#1A1A1A"/><circle cx="127" cy="78" r="5.5" fill="#37474F"/><circle cx="127" cy="78" r="2" fill="#CFD8DC"/>
        <circle cx="169" cy="78" r="8.5" fill="#1A1A1A"/><circle cx="169" cy="78" r="5.5" fill="#37474F"/><circle cx="169" cy="78" r="2" fill="#CFD8DC"/>
        <!-- Coupler 1→2 -->
        <rect x="178" y="57" width="10" height="4.5" rx="2" fill="#546E7A"/>

        <!-- CARRIAGE 2 (yellow) -->
        <rect x="186" y="28" width="69" height="10" rx="4" fill="#F57F17"/>
        <rect x="186" y="34" width="63" height="33" rx="5" fill="#F9A825"/>
        <rect x="191" y="38" width="14" height="13" rx="2" fill="#BBDEFB"/>
        <rect x="211" y="38" width="14" height="13" rx="2" fill="#BBDEFB"/>
        <rect x="229" y="38" width="11" height="13" rx="2" fill="#BBDEFB"/>
        <circle cx="198" cy="78" r="8.5" fill="#1A1A1A"/><circle cx="198" cy="78" r="5.5" fill="#37474F"/><circle cx="198" cy="78" r="2" fill="#CFD8DC"/>
        <circle cx="240" cy="78" r="8.5" fill="#1A1A1A"/><circle cx="240" cy="78" r="5.5" fill="#37474F"/><circle cx="240" cy="78" r="2" fill="#CFD8DC"/>
        <!-- Coupler 2→3 -->
        <rect x="249" y="57" width="10" height="4.5" rx="2" fill="#546E7A"/>

        <!-- CARRIAGE 3 (green) -->
        <rect x="257" y="28" width="69" height="10" rx="4" fill="#2E7D32"/>
        <rect x="257" y="34" width="63" height="33" rx="5" fill="#43A047"/>
        <rect x="262" y="38" width="14" height="13" rx="2" fill="#BBDEFB"/>
        <rect x="282" y="38" width="14" height="13" rx="2" fill="#BBDEFB"/>
        <rect x="300" y="38" width="11" height="13" rx="2" fill="#BBDEFB"/>
        <circle cx="269" cy="78" r="8.5" fill="#1A1A1A"/><circle cx="269" cy="78" r="5.5" fill="#37474F"/><circle cx="269" cy="78" r="2" fill="#CFD8DC"/>
        <circle cx="311" cy="78" r="8.5" fill="#1A1A1A"/><circle cx="311" cy="78" r="5.5" fill="#37474F"/><circle cx="311" cy="78" r="2" fill="#CFD8DC"/>
        <!-- End buffer -->
        <rect x="320" y="51" width="7" height="8" rx="2" fill="#E53935"/>
      </svg>
    </div>
    <h1 id="ls-title">🚂 湯瑪士火車樂園</h1>
    <div id="ls-score-bar">
      <span id="ls-score">⭐ 0 / 750 分</span>
      <button id="btn-reset" class="ls-reset-btn">🔄 重新開始</button>
    </div>
    <div id="ls-groups">
      <div class="ls-group" data-group="1">
        <div class="ls-group-label">⭐ 放 1 條軌道</div>
        <div class="ls-levels" id="ls-g1"></div>
      </div>
      <div class="ls-group" data-group="2">
        <div class="ls-group-label">⭐⭐ 放 2 條軌道</div>
        <div class="ls-levels" id="ls-g2"></div>
      </div>
      <div class="ls-group" data-group="3">
        <div class="ls-group-label">⭐⭐⭐ 放 3 條軌道</div>
        <div class="ls-levels" id="ls-g3"></div>
      </div>
      <div class="ls-group" data-group="4">
        <div class="ls-group-label">⭐⭐⭐⭐ 放 4 條軌道</div>
        <div class="ls-levels" id="ls-g4"></div>
      </div>
      <div class="ls-group" data-group="5">
        <div class="ls-group-label">⭐⭐⭐⭐⭐ 放 5 條軌道</div>
        <div class="ls-levels" id="ls-g5"></div>
      </div>
    </div>
    <button id="btn-free-mode" class="action-btn orange">🎨 自由建造</button>
  </div>

  <!-- ── GAME SCREEN ───────────────────────────────────────────────────── -->
  <div id="game-screen" style="display:none">
    <header id="header">
      <button id="btn-back" class="action-btn">← 返回</button>
      <div id="level-info">
        <div id="thomas-logo">
          <svg id="thomas-face" viewBox="0 0 80 60" width="60" height="45">
            <rect x="5" y="5" width="70" height="50" rx="8" fill="#1565C0"/>
            <rect x="10" y="10" width="60" height="35" rx="5" fill="#1976D2"/>
            <ellipse cx="25" cy="25" rx="10" ry="11" fill="white"/>
            <ellipse cx="55" cy="25" rx="10" ry="11" fill="white"/>
            <ellipse cx="27" cy="25" rx="6" ry="7" fill="#1565C0"/>
            <ellipse cx="57" cy="25" rx="6" ry="7" fill="#1565C0"/>
            <circle cx="29" cy="23" r="2" fill="white"/>
            <circle cx="59" cy="23" r="2" fill="white"/>
            <path d="M 22 38 Q 40 48 58 38" stroke="#FF8F00" stroke-width="3" fill="none" stroke-linecap="round"/>
            <ellipse cx="40" cy="32" rx="3" ry="2" fill="#FF8F00"/>
          </svg>
        </div>
        <div id="level-title-display"></div>
        <div id="gaps-counter"></div>
        <button id="btn-hint" class="hint-btn" title="提示" style="display:none">
          💡 <span class="hint-count">0</span>
        </button>
      </div>
      <div class="header-spacer"></div>
    </header>

    <!-- Toolbar -->
    <div id="toolbar">
      <div id="track-tools">
        <button class="tool-btn active" data-track="straight-h" data-unlock-level="1" title="橫向直軌">
          <svg viewBox="0 0 50 50" width="44" height="44"><rect x="0" y="20" width="50" height="10" fill="#8B4513"/><line x1="0" y1="17" x2="50" y2="17" stroke="#555" stroke-width="3"/><line x1="0" y1="33" x2="50" y2="33" stroke="#555" stroke-width="3"/><rect x="8" y="17" width="5" height="16" fill="#8B4513"/><rect x="20" y="17" width="5" height="16" fill="#8B4513"/><rect x="32" y="17" width="5" height="16" fill="#8B4513"/></svg>
          <span>直軌</span>
        </button>
        <button class="tool-btn" data-track="straight-v" data-unlock-level="1" title="縱向直軌">
          <svg viewBox="0 0 50 50" width="44" height="44"><rect x="20" y="0" width="10" height="50" fill="#8B4513"/><line x1="17" y1="0" x2="17" y2="50" stroke="#555" stroke-width="3"/><line x1="33" y1="0" x2="33" y2="50" stroke="#555" stroke-width="3"/><rect x="17" y="8" width="16" height="5" fill="#8B4513"/><rect x="17" y="20" width="16" height="5" fill="#8B4513"/><rect x="17" y="32" width="16" height="5" fill="#8B4513"/></svg>
          <span>直軌↕</span>
        </button>
        <button class="tool-btn" data-track="curve-ne" data-unlock-level="1" title="右上彎軌 (上↔右)">
          <svg viewBox="0 0 50 50" width="44" height="44">
            <path d="M 25 0 A 25 25 0 0 0 50 25" stroke="#8B6914" stroke-width="9" fill="none" stroke-linecap="round"/>
            <path d="M 31 0 A 19 19 0 0 0 50 19" stroke="#757575" stroke-width="2.5" fill="none"/>
            <path d="M 19 0 A 31 31 0 0 0 50 31" stroke="#757575" stroke-width="2.5" fill="none"/>
          </svg>
          <span>彎軌↗</span>
        </button>
        <button class="tool-btn" data-track="curve-nw" data-unlock-level="1" title="左上彎軌 (上↔左)">
          <svg viewBox="0 0 50 50" width="44" height="44">
            <path d="M 25 0 A 25 25 0 0 1 0 25" stroke="#8B6914" stroke-width="9" fill="none" stroke-linecap="round"/>
            <path d="M 19 0 A 19 19 0 0 1 0 19" stroke="#757575" stroke-width="2.5" fill="none"/>
            <path d="M 31 0 A 31 31 0 0 1 0 31" stroke="#757575" stroke-width="2.5" fill="none"/>
          </svg>
          <span>彎軌↖</span>
        </button>
        <button class="tool-btn" data-track="curve-se" data-unlock-level="1" title="右下彎軌 (下↔右)">
          <svg viewBox="0 0 50 50" width="44" height="44">
            <path d="M 25 50 A 25 25 0 0 1 50 25" stroke="#8B6914" stroke-width="9" fill="none" stroke-linecap="round"/>
            <path d="M 31 50 A 19 19 0 0 1 50 31" stroke="#757575" stroke-width="2.5" fill="none"/>
            <path d="M 19 50 A 31 31 0 0 1 50 19" stroke="#757575" stroke-width="2.5" fill="none"/>
          </svg>
          <span>彎軌↘</span>
        </button>
        <button class="tool-btn" data-track="curve-sw" data-unlock-level="1" title="左下彎軌 (下↔左)">
          <svg viewBox="0 0 50 50" width="44" height="44">
            <path d="M 25 50 A 25 25 0 0 0 0 25" stroke="#8B6914" stroke-width="9" fill="none" stroke-linecap="round"/>
            <path d="M 19 50 A 19 19 0 0 0 0 31" stroke="#757575" stroke-width="2.5" fill="none"/>
            <path d="M 31 50 A 31 31 0 0 0 0 19" stroke="#757575" stroke-width="2.5" fill="none"/>
          </svg>
          <span>彎軌↙</span>
        </button>
        <button class="tool-btn special" data-track="tunnel" data-unlock-level="5" title="山洞" style="display:none">
          <svg viewBox="0 0 50 50" width="44" height="44"><rect x="0" y="30" width="50" height="20" fill="#6d4c41"/><path d="M 5 30 Q 25 5 45 30 Z" fill="#546e7a"/><rect x="5" y="38" width="17" height="12" fill="#222"/><rect x="28" y="38" width="17" height="12" fill="#222"/><rect x="0" y="42" width="50" height="8" fill="#8B4513"/></svg>
          <span>山洞</span>
        </button>
        <button class="tool-btn special" data-track="bridge" data-unlock-level="5" title="橋梁" style="display:none">
          <svg viewBox="0 0 50 50" width="44" height="44"><rect x="0" y="20" width="50" height="8" fill="#8B4513"/><line x1="0" y1="18" x2="50" y2="18" stroke="#555" stroke-width="2"/><line x1="0" y1="30" x2="50" y2="30" stroke="#555" stroke-width="2"/><rect x="5" y="28" width="8" height="20" fill="#9e9e9e"/><rect x="37" y="28" width="8" height="20" fill="#9e9e9e"/><path d="M 9 28 Q 25 10 41 28" stroke="#9e9e9e" stroke-width="3" fill="none"/></svg>
          <span>橋梁</span>
        </button>
        <button class="tool-btn special" data-track="station" data-unlock-level="13" title="火車站" style="display:none">
          <svg viewBox="0 0 50 50" width="44" height="44">
            <rect x="0" y="28" width="50" height="22" fill="#BCAAA4"/>
            <rect x="4" y="28" width="42" height="4" fill="#6D4C41"/>
            <polygon points="0,28 25,8 50,28" fill="#E53935"/>
            <rect x="18" y="14" width="14" height="14" fill="#FFF9C4"/>
            <rect x="22" y="18" width="6" height="10" fill="#5D4037"/>
            <rect x="0" y="36" width="50" height="6" fill="#8D6E63"/>
          </svg>
          <span>火車站</span>
        </button>
        <button class="tool-btn special" data-track="crossing" data-unlock-level="14" title="平交道" style="display:none">
          <svg viewBox="0 0 50 50" width="44" height="44">
            <rect x="0" y="18" width="50" height="14" fill="#BCAAA4"/>
            <rect x="18" y="0" width="14" height="50" fill="#78909C"/>
            <rect x="18" y="0" width="14" height="4" fill="#F44336"/>
            <rect x="18" y="46" width="14" height="4" fill="#F44336"/>
            <line x1="24" y1="0" x2="24" y2="18" stroke="#FFD700" stroke-width="2.5" stroke-dasharray="4,4"/>
            <line x1="24" y1="32" x2="24" y2="50" stroke="#FFD700" stroke-width="2.5" stroke-dasharray="4,4"/>
            <line x1="0" y1="16" x2="50" y2="16" stroke="#555" stroke-width="2.5"/>
            <line x1="0" y1="34" x2="50" y2="34" stroke="#555" stroke-width="2.5"/>
          </svg>
          <span>平交道</span>
        </button>
      </div>
      <div id="action-btns">
        <button id="btn-test" class="action-btn green">
          <span>🚂 測試鐵軌！</span>
        </button>
        <button id="btn-stop" class="action-btn red" style="display:none">
          <span>🛑 停止</span>
        </button>
        <button id="btn-clear" class="action-btn orange">
          <span>🗑️ 清除</span>
        </button>
      </div>
    </div>

    <!-- Main area -->
    <div id="main-area">
      <canvas id="grid-canvas"></canvas>
      <canvas id="train-canvas"></canvas>
      <div id="gap-overlay"></div>
    </div>
  </div>

  <!-- ── MESSAGE OVERLAY ───────────────────────────────────────────────── -->
  <div id="message-overlay" style="display:none">
    <div id="message-box">
      <div id="message-icon"></div>
      <div id="message-text"></div>
      <div id="message-actions">
        <button id="message-close">好的！</button>
        <button id="message-next" style="display:none">下一關 →</button>
      </div>
    </div>
  </div>

</div>

<script src="tracks.js"></script>
<script src="train.js"></script>
<script src="sound.js"></script>
<script src="levels.js"></script>
<script src="app.js"></script>
</body>
</html>
