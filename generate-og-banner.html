<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>Generate OG Banner — Dino Rail Craft (Minecraft style)</title>
<style>
  body { margin: 0; background: #111; display: flex; flex-direction: column;
         align-items: center; justify-content: center; min-height: 100vh; gap: 14px; }
  canvas { max-width: 95vw; border: 2px solid #444; border-radius: 4px;
           image-rendering: pixelated; }
  p { color: #aaa; font-family: sans-serif; font-size: 13px; text-align: center; margin: 0; }
  button { padding: 10px 28px; font-size: 15px; cursor: pointer; border-radius: 8px;
           background: #35D07A; color: #093; font-weight: bold; border: none; font-family: sans-serif; }
  button:hover { background: #46e08a; }
</style>
</head>
<body>
<canvas id="c" width="1200" height="630"></canvas>
<p>方塊（麥塊）風 OG 圖預覽。點擊下載後，將 og-banner.png 放入專案根目錄並重新部署。<br>
   此設計與 scripts/render_og.py 一致。</p>
<button id="dl">⬇️ 下載 og-banner.png</button>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;
const W = 1200, H = 630;

// ── primitives ───────────────────────────────────────────────────────────────
function rect(x, y, w, h, c) {
  ctx.fillStyle = c;
  ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
}
function blend(a, b, t) {
  const pa = [parseInt(a.slice(1,3),16), parseInt(a.slice(3,5),16), parseInt(a.slice(5,7),16)];
  const pb = [parseInt(b.slice(1,3),16), parseInt(b.slice(3,5),16), parseInt(b.slice(5,7),16)];
  const m = pa.map((v,i)=>Math.round(v+(pb[i]-v)*t));
  return '#' + m.map(v=>v.toString(16).padStart(2,'0')).join('');
}
// Deterministic pseudo-random so re-exports are identical.
let _seed = 1337;
function rnd() { _seed = (_seed*1103515245 + 12345) & 0x7FFFFFFF; return _seed/0x7FFFFFFF; }

// ── palette ───────────────────────────────────────────────────────────────────
const SKY_TOP='#4A9ED8', SKY_MID='#79C2EC', SKY_LOW='#AEE2F5';
const SUN='#FFD740', SUN_CORE='#FFEC99', CLOUD='#FFFFFF', CLOUD_SH='#D6E6F2';
const HILL_FAR='#6FB84E', HILL_NEAR='#5A9E3A';
const GRASS_TOP='#7DC850', GRASS='#6CAB3C', GRASS_DK='#578E30';
const DIRT='#8B5E3C', DIRT_DK='#734B2E', DIRT_LT='#9C6B45';
const TRUNK='#6B4A2B', TRUNK_DK='#533921';
const LEAF='#4E8A2A', LEAF_LT='#63A838', LEAF_DK='#3B6B22';
const TIE='#5C3E2A', TIE_LT='#6E4B32', RAIL='#C4C4C4', RAIL_DK='#808080';
const IRON='#6B6B6B', IRON_LT='#9A9A9A', IRON_DK='#4F4F4F', IRON_IN='#3F3F3F';
const DINO='#5FA83C', DINO_LT='#7DC850', DINO_DK='#4E8A2A', DINO_OUT='#3B6B22';
const WHITE='#FFFFFF', BLACK='#1A1A1A';
const GOLD='#FFD740', GOLD_DK='#E0A814', EMERALD='#35D07A', EMERALD_D='#1EA05A';
const TXT_SH='#2A1A0A', TXT_FACE='#7DC850', TXT_FACE2='#FFE259';

// ── 5x7 pixel font ─────────────────────────────────────────────────────────────
const FONT = {
 "A":["01110","10001","10001","11111","10001","10001","10001"],
 "B":["11110","10001","11110","10001","10001","10001","11110"],
 "C":["01110","10001","10000","10000","10000","10001","01110"],
 "D":["11110","10001","10001","10001","10001","10001","11110"],
 "E":["11111","10000","11110","10000","10000","10000","11111"],
 "F":["11111","10000","11110","10000","10000","10000","10000"],
 "G":["01110","10001","10000","10111","10001","10001","01111"],
 "H":["10001","10001","10001","11111","10001","10001","10001"],
 "I":["11111","00100","00100","00100","00100","00100","11111"],
 "K":["10001","10010","11100","10010","10001","10001","10001"],
 "L":["10000","10000","10000","10000","10000","10000","11111"],
 "N":["10001","11001","10101","10011","10001","10001","10001"],
 "O":["01110","10001","10001","10001","10001","10001","01110"],
 "R":["11110","10001","10001","11110","10100","10010","10001"],
 "S":["01111","10000","10000","01110","00001","00001","11110"],
 "T":["11111","00100","00100","00100","00100","00100","00100"],
 "U":["10001","10001","10001","10001","10001","10001","01110"],
 "V":["10001","10001","10001","10001","10001","01010","00100"],
 "Y":["10001","10001","01010","00100","00100","00100","00100"],
 " ":["00000","00000","00000","00000","00000","00000","00000"],
 "!":["00100","00100","00100","00100","00100","00000","00100"],
 "'":["00100","00100","01000","00000","00000","00000","00000"],
};
function text(s, x, y, scale, face, shadow) {
  const cw = 6*scale;
  if (shadow) {
    let cx = x;
    for (const ch of s) {
      const g = FONT[ch] || FONT[" "];
      g.forEach((row, ry) => { for (let rxi=0; rxi<row.length; rxi++)
        if (row[rxi]==="1") rect(cx+rxi*scale+scale, y+ry*scale+scale, scale, scale, shadow); });
      cx += cw;
    }
  }
  let cx = x;
  for (const ch of s) {
    const g = FONT[ch] || FONT[" "];
    g.forEach((row, ry) => { for (let rxi=0; rxi<row.length; rxi++)
      if (row[rxi]==="1") rect(cx+rxi*scale, y+ry*scale, scale, scale, face); });
    cx += cw;
  }
}
function textWidth(s, scale) { return s.length*6*scale - scale; }

// ════ SKY — banded blocky gradient ════════════════════════════════════════════
const GROUND_Y = 430, band = 14;
for (let y=0; y<GROUND_Y; y+=band) {
  const t = y/GROUND_Y;
  const c = t<0.5 ? blend(SKY_TOP, SKY_MID, t/0.5) : blend(SKY_MID, SKY_LOW, (t-0.5)/0.5);
  rect(0, y, W, band, c);
}

// Blocky sun
function drawSun(cx, cy) {
  const s = 16;
  rect(cx-3*s, cy-3*s, 6*s, 6*s, SUN);
  rect(cx-2*s, cy-2*s, 4*s, 4*s, SUN_CORE);
  rect(cx-3*s, cy-3*s, s, s, SUN_CORE); rect(cx+2*s, cy-3*s, s, s, SUN_CORE);
  rect(cx-3*s, cy+2*s, s, s, SUN_CORE); rect(cx+2*s, cy+2*s, s, s, SUN_CORE);
  [[-5,0],[5,0],[0,-5],[0,5],[-4,-4],[4,-4],[-4,4],[4,4]].forEach(([dx,dy])=>
    rect(cx+dx*s-s/2, cy+dy*s-s/2, s, s, SUN));
}
drawSun(1070, 130);

// Blocky clouds
function cloud(x, y, s) {
  [[0,1,4,1],[1,0,3,1],[3,1,3,1],[1,2,6,1],[2,1,2,1],[5,0,2,1]].forEach(([bx,by,bw,bh])=>
    rect(x+bx*s, y+by*s, bw*s, bh*s, CLOUD));
  [[1,3,5,1],[3,2,3,1]].forEach(([bx,by,bw,bh])=> rect(x+bx*s, y+by*s, bw*s, bh*s, CLOUD_SH));
}
cloud(120,70,13); cloud(470,50,11); cloud(760,95,10); cloud(330,140,8);

// ════ BACKGROUND HILLS ════════════════════════════════════════════════════════
function hill(cx, base, r, color) {
  const steps=[[0,1],[0.18,0.92],[0.38,0.78],[0.58,0.58],[0.76,0.36],[0.9,0.16]];
  steps.forEach(([h_t,w_t])=>{
    const hh = Math.round(r*(1-h_t)) - Math.round(r*(1-(h_t+0.18)));
    rect(cx-r*w_t, base-r*h_t-hh, r*w_t*2, hh+4, color);
  });
}
hill(220,GROUND_Y,120,HILL_FAR); hill(540,GROUND_Y,150,HILL_FAR);
hill(980,GROUND_Y,135,HILL_FAR); hill(760,GROUND_Y,95,HILL_NEAR);

// ════ OAK TREES ════════════════════════════════════════════════════════════════
function tree(x, base, s) {
  rect(x-s, base-5*s, 2*s, 5*s, TRUNK);
  rect(x, base-5*s, s, 5*s, TRUNK_DK);
  const ly = base-11*s;
  ["0111110","1111111","1111111","1111111","0111110"].forEach((row, ry)=>{
    for (let rx=0; rx<row.length; rx++) if (row[rx]==="1") {
      const r=rnd(); let shade=LEAF;
      if (r>0.78) shade=LEAF_LT; else if (r<0.25) shade=LEAF_DK;
      rect(x-3*s+rx*s, ly+ry*s, s, s, shade);
    }
  });
}
tree(120, GROUND_Y+6, 9); tree(1110, GROUND_Y+10, 11); tree(640, GROUND_Y-2, 7);

// ════ GROUND — grass + textured dirt ═══════════════════════════════════════════
const BS = 30;
rect(0, GROUND_Y, W, 12, GRASS_TOP);
rect(0, GROUND_Y+12, W, 18, GRASS);
for (let x=0; x<W; x+=10) if (rnd()>0.5) rect(x, GROUND_Y-4, 4, 4, GRASS_TOP);
let yy = GROUND_Y+30, rowI = 0;
while (yy < H) {
  for (let x=0; x<W; x+=BS) {
    rect(x, yy, BS, BS, rowI%2===0 ? DIRT : blend(DIRT, DIRT_DK, 0.18));
    for (let k=0;k<5;k++){
      const sx=x+Math.floor(rnd()*(BS-6)), sy=yy+Math.floor(rnd()*(BS-6));
      rect(sx, sy, 6, 6, rnd()>0.45 ? DIRT_DK : DIRT_LT);
    }
    rect(x, yy, BS, 2, DIRT_DK);
    rect(x, yy, 2, BS, blend(DIRT, DIRT_DK, 0.4));
  }
  yy += BS; rowI++;
}

// ════ RAILS ═════════════════════════════════════════════════════════════════════
const RAIL_Y = GROUND_Y+60;
for (let x=-10; x<W+20; x+=46) {
  rect(x, RAIL_Y-4, 30, 40, TIE);
  rect(x, RAIL_Y-4, 30, 5, TIE_LT);
  rect(x+6, RAIL_Y+2, 4, 30, TIE_LT);
}
rect(0, RAIL_Y-10, W, 8, RAIL); rect(0, RAIL_Y-4, W, 3, RAIL_DK);
rect(0, RAIL_Y+30, W, 8, RAIL); rect(0, RAIL_Y+36, W, 3, RAIL_DK);

// ════ HERO — dino riding minecart ═══════════════════════════════════════════════
function drawMinecartDino(cx, cy, s) {
  rect(cx-9*s, cy+7*s, 18*s, 2*s, blend(GRASS_DK, BLACK, 0.25));
  // iron tub
  rect(cx-8*s, cy, 16*s, 7*s, IRON);
  rect(cx-8*s, cy, 16*s, s, IRON_LT);
  rect(cx-8*s, cy+6*s, 16*s, s, IRON_DK);
  rect(cx-8*s, cy, s, 7*s, IRON_LT);
  rect(cx+7*s, cy, s, 7*s, IRON_DK);
  rect(cx-7*s, cy+s, 14*s, 4*s, IRON_IN);
  for (let rx=-7; rx<8; rx+=3) rect(cx+rx*s, cy+5*s, s, s, IRON_LT);
  // wheels
  [-5,5].forEach(wx=>{ rect(cx+wx*s-2*s, cy+7*s, 4*s, 3*s, BLACK);
    rect(cx+wx*s-s, cy+8*s, 2*s, s, IRON_LT); });
  // tail
  rect(cx-11*s, cy+s, 3*s, 2*s, DINO_DK);
  rect(cx-10*s, cy, 2*s, 2*s, DINO);
  // body
  rect(cx-2*s, cy-4*s, 5*s, 5*s, DINO);
  rect(cx+2*s, cy-s, 2*s, 2*s, DINO_DK);
  // head
  const hx = cx-4*s, hy = cy-13*s;
  rect(hx, hy, 9*s, 8*s, DINO);
  rect(hx, hy, 9*s, s, DINO_LT);
  rect(hx-s, hy, s, 8*s, DINO_OUT);
  rect(hx+9*s, hy+3*s, s, 5*s, DINO_OUT);
  rect(hx, hy-s, 9*s, s, DINO_OUT);
  rect(hx+8*s, hy+3*s, 4*s, 4*s, DINO);
  rect(hx+8*s, hy+3*s, 4*s, s, DINO_LT);
  rect(hx+8*s, hy+6*s, 4*s, s, DINO_DK);
  rect(hx+10*s, hy+4*s, s, s, DINO_OUT);
  rect(hx+4*s, hy+s, 3*s, 3*s, WHITE);
  rect(hx+5*s, hy+2*s, 2*s, 2*s, BLACK);
  rect(hx+5*s, hy+2*s, s, s, WHITE);
  for (let i=0;i<3;i++) rect(hx+i*3*s+s, hy-2*s, s, 2*s, DINO_DK);
  for (let i=0;i<3;i++) rect(hx+8*s+i*s, hy+7*s, s, s, WHITE);
  rect(hx+6*s, hy+8*s, 2*s, 3*s, DINO_DK);
}
drawMinecartDino(510, RAIL_Y-6, 13);

// ════ COLLECTIBLES ══════════════════════════════════════════════════════════════
function goldStar(cx, cy, s) {
  rect(cx-2*s, cy-2*s, 5*s, 5*s, GOLD);
  rect(cx-s, cy-4*s, s, s, GOLD); rect(cx, cy-4*s, s, 2*s, GOLD); rect(cx+s, cy-4*s, s, s, GOLD);
  rect(cx-4*s, cy, s, s, GOLD); rect(cx+3*s, cy, s, s, GOLD);
  rect(cx-2*s, cy+3*s, s, 2*s, GOLD); rect(cx+2*s, cy+3*s, s, 2*s, GOLD);
  rect(cx-2*s, cy-2*s, 5*s, s, TXT_FACE2);
  rect(cx-2*s, cy+2*s, 5*s, s, GOLD_DK);
}
function emerald(cx, cy, s) {
  rect(cx-2*s, cy-s, 4*s, 3*s, EMERALD);
  rect(cx-s, cy-2*s, 2*s, s, EMERALD); rect(cx-s, cy+2*s, 2*s, s, EMERALD);
  rect(cx-2*s, cy-s, 4*s, s, blend(EMERALD, WHITE, 0.4));
  rect(cx-s, cy+s, 2*s, s, EMERALD_D);
}
goldStar(900,250,9); goldStar(1020,365,7);
emerald(185,250,11); emerald(710,250,8); goldStar(250,360,6);

// ════ TITLE LOGO ═════════════════════════════════════════════════════════════════
const sc = 11;
const l1 = "DINO RAIL", l2 = "CRAFT";
const w1 = textWidth(l1, sc), x1 = Math.round((W-w1)/2), y1 = 40;
text(l1, x1, y1, sc, TXT_FACE, TXT_SH);
const w2 = textWidth(l2, sc);
const playW = 9*sc, total2 = w2 + 3*sc + playW;
const x2 = Math.round((W-total2)/2), y2 = y1 + 9*sc;
text(l2, x2, y2, sc, TXT_FACE2, TXT_SH);
function playButton(x, y, s) {
  rect(x, y, 9*s, 9*s, TXT_SH);
  rect(x-s, y-s, 9*s, 9*s, EMERALD);
  rect(x-s, y-s, 9*s, s, blend(EMERALD, WHITE, 0.35));
  rect(x-s, y+7*s, 9*s, s, EMERALD_D);
  [[2,1,1,7],[3,2,1,5],[4,3,1,3],[5,4,1,1]].forEach(([bx,by,bw,bh])=>
    rect(x-s+bx*s, y-s+by*s, bw*s, bh*s, WHITE));
}
playButton(x2 + w2 + 3*sc, y2, sc);

// ── download ─────────────────────────────────────────────────────────────────────
document.getElementById('dl').addEventListener('click', () => {
  canvas.toBlob(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'og-banner.png';
    a.click();
  }, 'image/png');
});
</script>
</body>
</html>
