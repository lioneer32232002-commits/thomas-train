<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>Generate OG Banner</title>
<style>
  body { margin: 0; background: #111; display: flex; flex-direction: column;
         align-items: center; justify-content: center; min-height: 100vh; gap: 14px; }
  canvas { max-width: 95vw; border: 2px solid #444; border-radius: 4px; }
  p { color: #aaa; font-family: sans-serif; font-size: 13px; text-align: center; margin: 0; }
  button { padding: 10px 28px; font-size: 15px; cursor: pointer; border-radius: 8px;
           background: #1565C0; color: white; border: none; font-family: sans-serif; }
  button:hover { background: #1976D2; }
</style>
</head>
<body>
<canvas id="c" width="1200" height="630"></canvas>
<p>預覽如上。點擊下載後，將 og-banner.png 放入專案根目錄並重新部署。</p>
<button id="dl">⬇️ 下載 og-banner.png</button>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = 1200, H = 630;

// ── helpers ──────────────────────────────────────────────────────────────────

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r); ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h); ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x,y+r); ctx.arcTo(x,y,x+r,y,r);
  ctx.closePath();
}

// ── Sky: split atmosphere — clear blue (left) → stormy purple (right) ────────
const skyGrad = ctx.createLinearGradient(0, 0, W, H*0.6);
skyGrad.addColorStop(0,   '#87CEEB');
skyGrad.addColorStop(0.4, '#5ba3c9');
skyGrad.addColorStop(0.65,'#4a6fa5');
skyGrad.addColorStop(1,   '#2d2d4e');
ctx.fillStyle = skyGrad;
ctx.fillRect(0, 0, W, H*0.6);

// Ground gradient
const gndGrad = ctx.createLinearGradient(0, H*0.6, 0, H);
gndGrad.addColorStop(0, '#5a9e54');
gndGrad.addColorStop(1, '#2d5c28');
ctx.fillStyle = gndGrad;
ctx.fillRect(0, H*0.6, W, H*0.4);

// ── Storm clouds (right side, dino territory) ────────────────────────────────
function stormCloud(x, y, r, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = '#37474F';
  [[-r*0.7,0,r*0.65],[0,-r*0.3,r*0.9],[r*0.7,0,r*0.65],[0,r*0.2,r*0.5]].forEach(([dx,dy,rr]) => {
    ctx.beginPath(); ctx.arc(x+dx, y+dy, rr, 0, Math.PI*2); ctx.fill();
  });
  ctx.restore();
}
stormCloud(820, 95, 70, 0.85);
stormCloud(980, 70, 85, 0.9);
stormCloud(1110, 110, 60, 0.8);
stormCloud(740, 130, 55, 0.75);
stormCloud(1050, 150, 50, 0.7);

// Lightning
ctx.save();
ctx.strokeStyle = '#FFD740';
ctx.lineWidth = 3;
ctx.shadowColor = '#FFD740'; ctx.shadowBlur = 12;
ctx.globalAlpha = 0.9;
ctx.beginPath();
ctx.moveTo(970, 90); ctx.lineTo(955, 145); ctx.lineTo(970, 145); ctx.lineTo(950, 210);
ctx.stroke();
ctx.restore();

// ── Fluffy clouds (left side, train territory) ───────────────────────────────
function fluffyCloud(x, y, r) {
  ctx.fillStyle = 'rgba(255,255,255,0.88)';
  [[-r*0.7,0,r*0.65],[0,-r*0.35,r*0.9],[r*0.7,0,r*0.65]].forEach(([dx,dy,rr]) => {
    ctx.beginPath(); ctx.arc(x+dx, y+dy, rr, 0, Math.PI*2); ctx.fill();
  });
}
fluffyCloud(110, 85, 44);
fluffyCloud(310, 62, 36);

// ── Track ─────────────────────────────────────────────────────────────────────
const trackY = H * 0.72;

// Ballast
ctx.fillStyle = '#BCAAA4';
ctx.fillRect(0, trackY-22, W, 44);

// Ties (mostly intact left, broken/cracked on right)
ctx.fillStyle = '#6D4C41';
for (let tx = 10; tx < W * 0.62; tx += 86) {
  ctx.fillRect(tx, trackY-25, 48, 50);
}
// Broken ties right side
for (let tx = W * 0.64; tx < W; tx += 86) {
  ctx.save();
  ctx.translate(tx + 24, trackY);
  ctx.rotate((Math.random() > 0.5 ? 1 : -1) * 0.18);
  ctx.fillStyle = '#5D4037';
  ctx.fillRect(-24, -25, 44, 22);
  ctx.fillRect(-18, 3, 36, 18);
  ctx.restore();
}

// Rails
ctx.strokeStyle = '#757575'; ctx.lineWidth = 6;
ctx.beginPath(); ctx.moveTo(0, trackY-12); ctx.lineTo(W*0.72, trackY-12); ctx.stroke();
ctx.beginPath(); ctx.moveTo(0, trackY+12); ctx.lineTo(W*0.72, trackY+12); ctx.stroke();

// Rail cracks right side
ctx.strokeStyle = '#616161'; ctx.lineWidth = 5;
ctx.setLineDash([22, 18]);
ctx.beginPath(); ctx.moveTo(W*0.72, trackY-12); ctx.lineTo(W, trackY-12+20); ctx.stroke();
ctx.beginPath(); ctx.moveTo(W*0.72, trackY+12); ctx.lineTo(W, trackY+12+24); ctx.stroke();
ctx.setLineDash([]);

// Ground crack under dino stomp
ctx.strokeStyle = '#3E2723'; ctx.lineWidth = 3;
[[830,500],[845,485],[840,510],[856,490],[820,495]].forEach(([x,y]) => {
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x + (Math.random()*30+10)*(x>840?1:-1), y + (Math.random()*20+10));
  ctx.stroke();
});

// Dust / debris cloud at stomp site
ctx.save();
for (let i = 0; i < 22; i++) {
  const a = (i/22)*Math.PI*2, d = 30+Math.random()*55;
  const bx = 855 + Math.cos(a)*d*1.3, by = trackY-10 + Math.sin(a)*d*0.5;
  const br = 4 + Math.random()*14;
  ctx.globalAlpha = 0.18 + Math.random()*0.22;
  ctx.fillStyle = `hsl(${25+Math.random()*20},40%,${60+Math.random()*20}%)`;
  ctx.beginPath(); ctx.arc(bx, by, br, 0, Math.PI*2); ctx.fill();
}
ctx.restore();

// ── Thomas train (charging left→right) ───────────────────────────────────────
// Train is at about x=60–420, centered at trackY
const TX = 85, TY = trackY - 22;

// Steam puffs
for (let i = 0; i < 4; i++) {
  const sx = TX - 20 - i*40, sy = TY - 60 - i*18, sr = 18 + i*10;
  ctx.save();
  ctx.globalAlpha = 0.55 - i*0.1;
  ctx.fillStyle = 'white';
  ctx.beginPath(); ctx.arc(sx, sy, sr, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

// Body
ctx.fillStyle = '#1565C0';
roundRect(ctx, TX, TY, 310, 95, 14); ctx.fill();
ctx.fillStyle = '#0D47A1';
ctx.fillRect(TX, TY+78, 310, 17);
// Stripe
ctx.fillStyle = '#E53935';
ctx.fillRect(TX, TY+72, 310, 7);

// Cabin / cab
ctx.fillStyle = '#1976D2';
roundRect(ctx, TX+220, TY-50, 90, 50, 8); ctx.fill();
ctx.fillStyle = '#0D47A1';
ctx.fillRect(TX+220, TY-6, 90, 6);

// Chimney
ctx.fillStyle = '#1A237E';
roundRect(ctx, TX+40, TY-60, 28, 60, 5); ctx.fill();
ctx.fillStyle = '#283593';
roundRect(ctx, TX+32, TY-65, 44, 14, 4); ctx.fill();

// Windows on cab
ctx.fillStyle = '#90CAF9';
roundRect(ctx, TX+230, TY-42, 32, 26, 4); ctx.fill();
roundRect(ctx, TX+272, TY-42, 32, 26, 4); ctx.fill();
ctx.strokeStyle = '#0D47A1'; ctx.lineWidth = 2;
ctx.strokeRect(TX+230, TY-42, 32, 26);
ctx.strokeRect(TX+272, TY-42, 32, 26);

// Porthole window on body
ctx.fillStyle = '#90CAF9';
ctx.beginPath(); ctx.arc(TX+80, TY+40, 22, 0, Math.PI*2); ctx.fill();
ctx.strokeStyle = '#0D47A1'; ctx.lineWidth = 3;
ctx.beginPath(); ctx.arc(TX+80, TY+40, 22, 0, Math.PI*2); ctx.stroke();

// Cowcatcher / front buffer
ctx.fillStyle = '#E53935';
ctx.beginPath();
ctx.moveTo(TX, TY+20); ctx.lineTo(TX-22, TY+38); ctx.lineTo(TX-22, TY+85); ctx.lineTo(TX, TY+85);
ctx.closePath(); ctx.fill();
ctx.fillStyle = '#B71C1C';
ctx.fillRect(TX-24, TY+75, 26, 12);

// Wheels
[[TX+50, trackY+20],[TX+140, trackY+20],[TX+240, trackY+20],[TX+300, trackY+18]].forEach(([wx,wy]) => {
  const wr = wx < TX+200 ? 34 : 26;
  ctx.fillStyle = '#1A1A1A';
  ctx.beginPath(); ctx.arc(wx, wy, wr, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#37474F';
  ctx.beginPath(); ctx.arc(wx, wy, wr-6, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#CFD8DC';
  ctx.beginPath(); ctx.arc(wx, wy, 7, 0, Math.PI*2); ctx.fill();
  // Spokes
  ctx.strokeStyle = '#546E7A'; ctx.lineWidth = 2.5;
  for (let s=0;s<6;s++){
    const a=s/6*Math.PI*2;
    ctx.beginPath();
    ctx.moveTo(wx+Math.cos(a)*7, wy+Math.sin(a)*7);
    ctx.lineTo(wx+Math.cos(a)*(wr-7), wy+Math.sin(a)*(wr-7));
    ctx.stroke();
  }
});

// ── Thomas FACE on front ──────────────────────────────────────────────────────
// Face plate on the front of the engine
const faceX = TX - 2, faceY = TY + 10;
ctx.fillStyle = '#1565C0';
roundRect(ctx, faceX-18, faceY, 22, 52, 5); ctx.fill();
ctx.fillStyle = '#1976D2';
roundRect(ctx, faceX-16, faceY+2, 18, 38, 3); ctx.fill();

// Eyes
ctx.fillStyle = 'white';
ctx.beginPath(); ctx.ellipse(faceX-9, faceY+14, 5, 6, 0, 0, Math.PI*2); ctx.fill();
ctx.beginPath(); ctx.ellipse(faceX-9, faceY+28, 5, 6, 0, 0, Math.PI*2); ctx.fill();
ctx.fillStyle = '#1565C0';
ctx.beginPath(); ctx.ellipse(faceX-8, faceY+14, 3, 4, 0, 0, Math.PI*2); ctx.fill();
ctx.beginPath(); ctx.ellipse(faceX-8, faceY+28, 3, 4, 0, 0, Math.PI*2); ctx.fill();
// Highlight
ctx.fillStyle='white';
ctx.beginPath(); ctx.arc(faceX-7, faceY+12, 1.5, 0, Math.PI*2); ctx.fill();
ctx.beginPath(); ctx.arc(faceX-7, faceY+26, 1.5, 0, Math.PI*2); ctx.fill();
// Determined smile (straight / slight grin)
ctx.strokeStyle='#FF8F00'; ctx.lineWidth=2.5; ctx.lineCap='round';
ctx.beginPath();
ctx.moveTo(faceX-15, faceY+43); ctx.quadraticCurveTo(faceX-9, faceY+48, faceX-3, faceY+43);
ctx.stroke();

// Motion lines
ctx.save();
ctx.strokeStyle = 'rgba(255,255,255,0.6)';
ctx.lineWidth = 3; ctx.lineCap = 'round';
[[TX-60, TY+15, 40],[TX-55, TY+45, 30],[TX-70, TY+75, 50]].forEach(([lx,ly,len]) => {
  ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(lx-len, ly); ctx.stroke();
});
ctx.restore();

// ── T-Rex (stomping on tracks, right side) ────────────────────────────────────
const DX = 830, DY = trackY - 10;
const DS = 1;  // scale factor (drawing units ≈ pixels)

// Shadow
ctx.save();
ctx.globalAlpha = 0.3;
ctx.fillStyle = '#1a1a1a';
ctx.beginPath(); ctx.ellipse(DX+10, DY+28, 100, 22, 0, 0, Math.PI*2); ctx.fill();
ctx.restore();

// Tail
ctx.fillStyle = '#4E342E';
ctx.beginPath();
ctx.moveTo(DX+80, DY-50);
ctx.bezierCurveTo(DX+150, DY-30, DX+210, DY-80, DX+230, DY-120);
ctx.bezierCurveTo(DX+220, DY-90, DX+160, DY-30, DX+90, DY-30);
ctx.closePath(); ctx.fill();

// Body
ctx.fillStyle = '#4E342E';
ctx.beginPath(); ctx.ellipse(DX, DY-60, 95, 68, -0.1, 0, Math.PI*2); ctx.fill();

// Underbelly
ctx.fillStyle = '#8D6E63';
ctx.beginPath(); ctx.ellipse(DX-5, DY-42, 55, 42, -0.05, 0, Math.PI*2); ctx.fill();

// Neck
ctx.fillStyle = '#4E342E';
ctx.beginPath();
ctx.moveTo(DX-60, DY-105);
ctx.bezierCurveTo(DX-80, DY-155, DX-60, DY-190, DX-40, DY-215);
ctx.bezierCurveTo(DX-20, DY-190, DX-20, DY-155, DX-30, DY-105);
ctx.closePath(); ctx.fill();

// Head
ctx.fillStyle = '#4E342E';
ctx.beginPath(); ctx.ellipse(DX-50, DY-235, 72, 46, -0.2, 0, Math.PI*2); ctx.fill();

// Snout / jaw — open menacingly
ctx.fillStyle = '#6D4C41';
ctx.beginPath(); ctx.ellipse(DX-90, DY-222, 50, 26, -0.15, 0, Math.PI*2); ctx.fill();
// Lower jaw open
ctx.fillStyle = '#5D4037';
ctx.beginPath();
ctx.moveTo(DX-50, DY-225);
ctx.bezierCurveTo(DX-60, DY-200, DX-100, DY-195, DX-120, DY-200);
ctx.bezierCurveTo(DX-118, DY-210, DX-78, DY-215, DX-55, DY-222);
ctx.closePath(); ctx.fill();
// Teeth
ctx.fillStyle = '#FFFDE7';
for (let t = 0; t < 5; t++) {
  const tx2 = DX-115 + t*14, ty2 = DY-202;
  ctx.beginPath(); ctx.moveTo(tx2, ty2); ctx.lineTo(tx2+5, ty2-10); ctx.lineTo(tx2+10, ty2); ctx.fill();
}
// Upper teeth
ctx.fillStyle = '#FFFDE7';
for (let t = 0; t < 5; t++) {
  const tx2 = DX-112 + t*13, ty2 = DY-218;
  ctx.beginPath(); ctx.moveTo(tx2, ty2); ctx.lineTo(tx2+5, ty2+10); ctx.lineTo(tx2+10, ty2); ctx.fill();
}

// Angry eye
ctx.fillStyle = '#FFEB3B';
ctx.beginPath(); ctx.ellipse(DX-28, DY-248, 18, 14, 0, 0, Math.PI*2); ctx.fill();
ctx.fillStyle = '#E53935';
ctx.beginPath(); ctx.ellipse(DX-26, DY-248, 12, 12, 0, 0, Math.PI*2); ctx.fill();
ctx.fillStyle = '#111';
ctx.beginPath(); ctx.arc(DX-24, DY-248, 7, 0, Math.PI*2); ctx.fill();
ctx.fillStyle = 'white';
ctx.beginPath(); ctx.arc(DX-22, DY-252, 3, 0, Math.PI*2); ctx.fill();
// Angry brow
ctx.strokeStyle='#1a0a00'; ctx.lineWidth=5;
ctx.beginPath(); ctx.moveTo(DX-46, DY-268); ctx.lineTo(DX-12, DY-260); ctx.stroke();

// Tiny arms reaching toward train
ctx.fillStyle = '#5D4037';
ctx.beginPath(); ctx.ellipse(DX-55, DY-110, 22, 12, 1.1, 0, Math.PI*2); ctx.fill();
ctx.fillStyle = '#4E342E';
ctx.beginPath(); ctx.ellipse(DX-72, DY-100, 14, 8, 1.3, 0, Math.PI*2); ctx.fill();
// Claws
ctx.strokeStyle='#3E2723'; ctx.lineWidth=2.5;
[[DX-80,DY-96],[DX-76,DY-90],[DX-83,DY-103]].forEach(([cx2,cy2]) => {
  ctx.beginPath(); ctx.moveTo(cx2,cy2); ctx.lineTo(cx2-10,cy2-5); ctx.stroke();
});

// Left leg (standing)
ctx.fillStyle = '#4E342E';
ctx.fillRect(DX-35, DY-25, 34, 70);
ctx.fillStyle = '#3E2723';
ctx.fillRect(DX-40, DY+42, 50, 16);
// Claws foot
ctx.strokeStyle='#1a0a00'; ctx.lineWidth=3;
[[DX-40,DY+58],[DX-26,DY+58],[DX-12,DY+58]].forEach(([cx2,cy2])=>{
  ctx.beginPath(); ctx.moveTo(cx2,cy2); ctx.lineTo(cx2-5,cy2+14); ctx.stroke();
});

// Right leg RAISED (stomping — mid-air, bent at knee)
ctx.fillStyle='#4E342E';
// Thigh (raised)
ctx.beginPath();
ctx.moveTo(DX+25, DY-22);
ctx.lineTo(DX+55, DY-62);
ctx.lineTo(DX+70, DY-45);
ctx.lineTo(DX+38, DY-8);
ctx.closePath(); ctx.fill();
// Shin (swinging forward and down)
ctx.beginPath();
ctx.moveTo(DX+55, DY-62);
ctx.lineTo(DX+48, DY+10);
ctx.lineTo(DX+62, DY+12);
ctx.lineTo(DX+70, DY-45);
ctx.closePath(); ctx.fill();
// Foot impact
ctx.fillStyle='#3E2723';
ctx.fillRect(DX+42, DY+10, 55, 16);
ctx.strokeStyle='#1a0a00'; ctx.lineWidth=3;
[[DX+44,DY+26],[DX+60,DY+26],[DX+76,DY+26]].forEach(([cx2,cy2])=>{
  ctx.beginPath(); ctx.moveTo(cx2,cy2); ctx.lineTo(cx2-4,cy2+16); ctx.stroke();
});

// ── Roar wave lines coming from dino ─────────────────────────────────────────
ctx.save();
ctx.strokeStyle = 'rgba(255,100,50,0.45)';
ctx.lineWidth = 2.5;
for (let i = 1; i <= 4; i++) {
  ctx.globalAlpha = 0.5 - i*0.08;
  ctx.beginPath();
  ctx.arc(DX-90, DY-220, 40+i*35, -0.8, 0.8);
  ctx.stroke();
}
ctx.restore();

// ── Final polish: vignette ────────────────────────────────────────────────────
const vig = ctx.createRadialGradient(W/2, H/2, H*0.3, W/2, H/2, H*0.85);
vig.addColorStop(0, 'rgba(0,0,0,0)');
vig.addColorStop(1, 'rgba(0,0,0,0.38)');
ctx.fillStyle = vig;
ctx.fillRect(0, 0, W, H);

// ── Download ──────────────────────────────────────────────────────────────────
document.getElementById('dl').addEventListener('click', () => {
  canvas.toBlob(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'og-banner.png';
    a.click();
  }, 'image/png');
});
</script>
</body>
</html>
